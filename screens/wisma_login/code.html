<div class="w-full max-w-sm flex flex-col gap-lg bg-surface-container-low p-lg border border-outline-variant rounded-DEFAULT shadow-lg shadow-black/50">

<form class="flex flex-col gap-md w-full">
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-on-surface-variant uppercase" for="email">Email / Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">person</span>
<input class="w-full bg-surface-container-highest border border-outline-variant text-on-background font-body-md p-3 pl-10 rounded-DEFAULT focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline" id="email" placeholder="Enter your email" type="text"/>
</div>
</div>
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-on-surface-variant uppercase" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input class="w-full bg-surface-container-highest border border-outline-variant text-on-background font-body-md p-3 pl-10 rounded-DEFAULT focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex justify-end mt-unit">
<a class="font-label-sm text-primary hover:text-primary-fixed transition-colors" href="#">Forgot Password?</a>
</div>
<button class="w-full bg-primary text-on-primary font-label-sm uppercase p-4 rounded-full hover:bg-primary-fixed transition-colors mt-sm flex justify-center items-center gap-2 shadow-sm" type="button">
