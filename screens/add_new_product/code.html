<style>
        body { font-family: 'Geist', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Form Element Reset for experimental zero-radius style */
        input[type="text"], input[type="date"], input[type="number"], select {
            border-radius: 1rem;
            background-color: transparent;
            border: 1px solid #434656;
            color: #e0e3e5;
            padding: 12px 16px;
            font-family: 'Geist', sans-serif;
            font-size: 16px;
        }
        input[type="text"]:focus, input[type="date"]:focus, input[type="number"]:focus, select:focus {
            outline: none;
            border-color: #0052ff;
            box-shadow: none;
        }
        select option {
            background-color: #191c1e;
            color: #e0e3e5;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background min-h-screen flex flex-col antialiased selection:bg-surface-container selection:text-on-surface">
<!-- Top Navigation (Intent: Transactional -> Exclude main shell, keep contextual header) -->
<header class="w-full top-0 sticky bg-background border-b border-outline-variant flex justify-between items-center px-gutter h-16 w-full max-w-screen-xl mx-auto z-40">
<div class="flex items-center gap-4">
<button aria-label="Go back" class="p-2 -ml-2 text-on-surface hover:bg-surface-container transition-colors duration-100 ease-linear rounded-full focus:outline-none focus:ring-1 focus:ring-on-surface">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div>
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight">Add Product</h1>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1">Track a new product</p>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-screen-md mx-auto px-gutter py-lg pb-32">
<form class="space-y-lg">
<!-- Section: Product Information -->
<fieldset class="space-y-md bg-surface-container border border-outline-variant p-gutter rounded-xl relative overflow-hidden">
<legend class="font-label-sm text-label-sm text-on-surface-variant mb-4 uppercase tracking-widest block w-full border-b border-outline-variant pb-2">Product Information</legend>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Product Name -->
<div class="flex flex-col gap-unit col-span-1 md:col-span-2">
<label class="font-label-sm text-label-sm text-on-surface uppercase" for="productName">Product Name</label>
<input class="w-full focus:ring-0 transition-colors duration-100" id="productName" name="productName" placeholder="e.g. MacBook M3 Pro" type="text"/>
</div>
<!-- Brand -->
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-on-surface uppercase" for="brand">Brand</label>
<input class="w-full focus:ring-0 transition-colors duration-100" id="brand" name="brand" placeholder="e.g. Apple" type="text"/>
</div>
<!-- Category -->
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-on-surface uppercase" for="category">Category</label>
<div class="relative">
<select class="w-full appearance-none focus:ring-0 transition-colors duration-100 pr-10" id="category" name="category">
<option disabled="" selected="" value="">Select Category</option>
<option value="warranty">Warranty</option>
<option value="insurance">Insurance</option>
<option value="subscription">Subscriptions</option>
<option value="membership">Membership</option>
<option value="amc">AMC</option>
<option value="contract">Contract</option>
<option value="license">License</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">arrow_drop_down</span>
</div>
</div>
<!-- Purchase Date -->
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-on-surface uppercase" for="purchaseDate">Purchase Date</label>
<div class="relative">
<input class="w-full focus:ring-0 transition-colors duration-100 [&amp;::-webkit-calendar-picker-indicator]:invert-[1]" id="purchaseDate" name="purchaseDate" type="date"/>
</div>
</div>
<!-- Seller / Store -->
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-on-surface uppercase" for="seller">Seller / Store</label>
<input class="w-full focus:ring-0 transition-colors duration-100" id="seller" name="seller" placeholder="e.g. Amazon" type="text"/>
</div>
</div>
</fieldset>
<!-- Section: Warranty Details -->
<fieldset class="space-y-md bg-surface-container border border-outline-variant p-gutter rounded-xl relative overflow-hidden">
<legend class="font-label-sm text-label-sm text-on-surface-variant mb-4 uppercase tracking-widest block w-full border-b border-outline-variant pb-2">Warranty Details</legend>
<div class="grid grid-cols-2 gap-md">
<!-- Duration -->
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-on-surface uppercase" for="duration">Duration</label>
<input class="w-full focus:ring-0 transition-colors duration-100" id="duration" min="1" name="duration" placeholder="1" type="number"/>
</div>
<!-- Unit -->
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-on-surface uppercase" for="unit">Unit</label>
<div class="relative">
<select class="w-full appearance-none focus:ring-0 transition-colors duration-100 pr-10" id="unit" name="unit">
<option value="years">Years</option>
<option value="months">Months</option>
<option value="days">Days</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">arrow_drop_down</span>
</div>
</div>
</div>
</fieldset>
<!-- Section: Invoice Upload -->
<fieldset class="space-y-md bg-surface-container border border-outline-variant p-gutter rounded-xl">
<legend class="font-label-sm text-label-sm text-on-surface-variant mb-4 uppercase tracking-widest block w-full border-b border-outline-variant pb-2">Invoice</legend>
<!-- Upload Area -->
<div class="border border-dashed border-outline-variant hover:border-primary-container transition-colors duration-200 bg-surface-container-high flex flex-col items-center justify-center p-lg cursor-pointer group rounded-xl">
<span class="material-symbols-outlined text-display text-on-surface-variant group-hover:text-primary-container transition-colors duration-200 mb-2" style="font-variation-settings: 'FILL' 0;">upload_file</span>
<p class="font-body-md text-body-md text-on-surface text-center">Click to upload invoice or drag and drop</p>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1 text-center">PDF, JPG, PNG (Max 5MB)</p>
<input accept=".pdf,image/*" class="hidden" type="file"/>
</div>
<!-- Attached File State (Hidden by default, shown for demonstration) -->
<div class="hidden border border-outline-variant bg-surface flex items-center justify-between p-sm rounded-xl">
<div class="flex items-center gap-3 overflow-hidden">
<div class="bg-surface-container-high p-2 rounded-lg">
<span class="material-symbols-outlined text-on-surface" style="font-variation-settings: 'FILL' 1;">description</span>
</div>
<div class="overflow-hidden flex-1">
<p class="font-body-md text-body-md text-on-surface truncate">invoice_1774958223869.jpeg</p>
<p class="font-label-sm text-label-sm text-on-surface">Ready to save</p>
</div>
</div>
<button aria-label="Remove invoice" class="p-2 text-error hover:bg-error/10 transition-colors duration-150 rounded-full" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">delete</span>
</button>
</div>
</fieldset>
<!-- Sticky Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-background border-t border-outline-variant p-gutter z-50 md:relative md:border-t-0 md:bg-transparent md:p-0 md:pt-md">
<div class="max-w-screen-md mx-auto">
<button class="w-full bg-primary-container text-on-primary-container font-headline-md text-headline-md py-4 flex items-center justify-center gap-2 hover:opacity-90 transition-opacity duration-150 active:scale-[0.99] rounded-full" type="submit">
<span>Add Product</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">check</span>
</button>
</div>
</div>
</form>
</main>
<!-- Navigation suppressed due to Transactional intent (Add Product flow) -->
</body></html>
